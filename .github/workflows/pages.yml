# Helios Frame -> GitHub Pages
# Derleme yok: yalnızca statik dosyalar yayınlanır (node_modules, tests, .git hariç).
# Adres: https://<kullanici>.github.io/helios-frame/   (kılavuz: /docs/)
name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Yayın klasörünü hazırla
        run: |
          mkdir _site
          cp -r index.html assets data docs src vendor .nojekyll _site/
          # SPA (history modu) için derin bağlantılar 404 yerine uygulamaya düşsün
          cp index.html _site/404.html

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
